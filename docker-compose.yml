services:
  agentfield:
    image: agentfield/control-plane:latest
    pull_policy: always
    ports:
      - "8080:8080"
    environment:
      - AF_MODE=dev
      - AGENTFIELD_HTTP_ADDR=0.0.0.0:8080
      - AGENTFIELD_STORAGE_MODE=local
    volumes:
      - agentfield-data:/data
    restart: unless-stopped

  pr-af:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8004:8004"
    environment:
      # Cross-container defaults. `agentfield` and `pr-af` are service names on
      # this project's bridge network; the localhost/127.0.0.1 code defaults
      # (which are correct when the node runs on the host) never reach across a
      # container boundary. The ${VAR:-default} form keeps an explicit .env or
      # shell value winning — e.g. pointing at a control plane outside compose —
      # while an unset/empty value falls back to the working container value, so
      # a stock `docker compose up` needs no override. AGENT_CALLBACK_URL must
      # name THIS node's own service and port (see .env.example).
      - AGENTFIELD_SERVER=${AGENTFIELD_SERVER:-http://agentfield:8080}
      - AGENTFIELD_API_KEY=${AGENTFIELD_API_KEY:-}
      - AGENT_CALLBACK_URL=${AGENT_CALLBACK_URL:-http://pr-af:8004}
      - PR_AF_PROVIDER=${PR_AF_PROVIDER:-aforge}
      - AGENTFIELD_AFORGE_COMMAND=${AGENTFIELD_AFORGE_COMMAND:-exec}
      - PR_AF_MODEL=${PR_AF_MODEL:-deepseek/deepseek-v4-flash-0731}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - GH_TOKEN=${GH_TOKEN:-}
      - XDG_DATA_HOME=/home/praf/.local/share
      - PR_AF_WORKDIR=/workspaces
      # Pass-through (bare, no `=`): forwarded only when set in .env or the
      # shell, so an unset var keeps the node's own default.
      - PR_AF_GIT_TIMEOUT_SECONDS
      - PR_AF_SKIP_GIT_LFS
      - PR_AF_MAX_COST_USD
      - PR_AF_MAX_DURATION_SECONDS
      - PR_AF_MAX_CONCURRENT_REVIEWERS
      - PR_AF_MAX_REVIEW_DEPTH
      - PR_AF_MAX_COVERAGE_ITERATIONS
    volumes:
      - pr-af-workspaces:/workspaces
      - opencode-data:/home/praf/.local/share
    depends_on:
      agentfield:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8004/health"]
      interval: 60s
      timeout: 30s
      retries: 5
      start_period: 30s
    restart: unless-stopped

volumes:
  agentfield-data:
  pr-af-workspaces:
  opencode-data:
